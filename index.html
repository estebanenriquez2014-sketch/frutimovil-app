<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Frutimóvil</title>
<meta name="theme-color" content="#7B1E3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frutimóvil">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--vino:#7B1E3A;--vino2:#A8385A;--rosa:#FCE4EC;--rosa2:#F8BBD0;--fondo:#FFF7FA;--txt:#2B1A20;--gris:#7A6A70;--verde:#1E7B34}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
header{background:var(--vino);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
header img{width:36px;height:36px;border-radius:10px}
header .t{font-weight:700;font-size:18px}
header .s{font-size:12px;opacity:.8}
header button{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:18px;padding:7px 12px;font-size:13px}
#aviso{display:none;background:#fff;border-bottom:1px solid var(--rosa2);padding:12px 16px;font-size:14px}
#aviso b{color:var(--vino)}
#aviso button{background:var(--vino);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px;margin-top:8px}
#chat{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:9px 12px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:15px;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.yo{align-self:flex-end;background:var(--vino);color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.bot .bts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bot .bts button{flex:1;min-width:110px;border:1.5px solid var(--vino);background:#fff;color:var(--vino);border-radius:12px;padding:9px;font-size:15px;font-weight:600}
.bot .bts button.si{background:var(--vino);color:#fff}
.bot .bts button:disabled{opacity:.45}
.hora{font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.escribiendo{align-self:flex-start;background:#fff;border-radius:16px;padding:10px 14px;color:var(--gris);font-size:14px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;flex-shrink:0;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex-shrink:0;border:1px solid var(--rosa2);background:#fff;color:var(--vino);border-radius:18px;padding:7px 12px;font-size:14px}
form{display:flex;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--fondo);flex-shrink:0}
textarea{flex:1;resize:none;border:1px solid var(--rosa2);border-radius:22px;padding:11px 15px;font:inherit;font-size:16px;max-height:120px;background:#fff;outline:none}
textarea:focus{border-color:var(--vino2)}
form button{width:46px;height:46px;border-radius:50%;border:0;background:var(--vino);color:#fff;font-size:20px;flex-shrink:0}
form button:disabled{opacity:.5}
.vacio{margin:auto;text-align:center;color:var(--gris);padding:20px;font-size:14px}
.vacio img{width:72px;border-radius:18px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <img src="icono-192.png" alt="">
  <div><div class="t">Frutimóvil</div><div class="s" id="quien">Conectando…</div></div>
  <button id="btnAvisos" style="display:none">🔔 Activar avisos</button>
</header>
<div id="aviso"></div>
<div id="chat"></div>
<div id="chips">
  <button data-t="¿Cuánto stock hay?">📦 Stock</button>
  <button data-t="¿Qué hay que comprar?">🛒 Qué comprar</button>
  <button data-t="¿Quién me debe?">💳 Quién debe</button>
  <button data-t="¿Cuánto vendimos hoy?">📊 Ventas hoy</button>
  <button data-t="¿Cuánto vendimos esta semana?">📈 Semana</button>
  <button data-t="deshacer">↩️ Deshacer</button>
  <button data-t="ayuda">❓ Ayuda</button>
</div>
<form id="f">
  <textarea id="txt" rows="1" placeholder="Escribe: compré 10 kg de fresa a Fabricio a 1.40" enterkeyhint="send"></textarea>
  <button id="enviar" aria-label="Enviar">➤</button>
</form>
<script>
const API = 'https://frutimovil.duckdns.org/webhook/fm-app-api';
const qs = new URLSearchParams(location.search);
let token = qs.get('t') || '';
try { if (token) localStorage.setItem('fm_token', token); else token = localStorage.getItem('fm_token') || ''; } catch (e) {}
const $ = id => document.getElementById(id);
const chat = $('chat');
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

let historial = [];
try { historial = JSON.parse(localStorage.getItem('fm_hist') || '[]'); } catch (e) {}
function guardar() { try { localStorage.setItem('fm_hist', JSON.stringify(historial.slice(-80))); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function formato(s) { return esc(s).replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/(^|\s)_([^_\n]+)_/g, '$1<i>$2</i>'); }
function hora(ts) { const d = new Date(ts); return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0'); }
function pintar(m, idx) {
  const div = document.createElement('div');
  div.className = 'm ' + (m.de === 'yo' ? 'yo' : 'bot');
  div.innerHTML = formato(m.texto) + '<div class="hora">' + hora(m.ts) + '</div>';
  if (m.botones && m.botones.length) {
    const b = document.createElement('div'); b.className = 'bts';
    m.botones.forEach(bt => {
      const x = document.createElement('button');
      x.textContent = bt.titulo; if (bt.id === 'si') x.className = 'si';
      x.disabled = !!m.usado || idx !== historial.length - 1;
      x.onclick = () => { m.usado = true; guardar(); enviar(bt.titulo, bt.id); };
      b.appendChild(x);
    });
    div.insertBefore(b, div.querySelector('.hora'));
  }
  chat.appendChild(div);
}
function render() {
  chat.innerHTML = '';
  if (!historial.length) chat.innerHTML = '<div class="vacio"><img src="icono-192.png" alt=""><br>Escríbeme como en WhatsApp:<br><b>"compré 10 kg de fresa a Fabricio a 1.40"</b><br>o toca un botón de abajo 👇</div>';
  historial.forEach((m, i) => pintar(m, i));
  chat.scrollTop = chat.scrollHeight;
}
async function api(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ token }, body)) });
  if (r.status === 401) throw new Error('Este link no es válido. Pídele a Esteban tu link de acceso.');
  if (!r.ok) throw new Error('El servidor no respondió (' + r.status + ').');
  return r.json();
}
let ocupado = false;
async function enviar(texto, boton) {
  texto = (texto || '').trim();
  if ((!texto && !boton) || ocupado) return;
  ocupado = true; $('enviar').disabled = true;
  historial.push({ de: 'yo', texto: texto || boton, ts: Date.now() }); guardar(); render();
  const esc = document.createElement('div'); esc.className = 'escribiendo'; esc.textContent = 'Fruti-Bot está escribiendo…'; chat.appendChild(esc); chat.scrollTop = chat.scrollHeight;
  try {
    const d = await api({ accion: 'mensaje', texto: boton ? '' : texto, boton_id: boton || '' });
    historial.push({ de: 'bot', texto: d.texto || '…', botones: d.botones || [], ts: Date.now() });
  } catch (e) {
    historial.push({ de: 'bot', texto: '⚠️ ' + e.message, ts: Date.now() });
  }
  guardar(); ocupado = false; $('enviar').disabled = false; render();
}
$('f').onsubmit = e => { e.preventDefault(); const t = $('txt').value; $('txt').value = ''; autoAlto(); enviar(t); };
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('f').requestSubmit(); } });
function autoAlto() { const t = $('txt'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
$('txt').addEventListener('input', autoAlto);
document.querySelectorAll('#chips button').forEach(b => b.onclick = () => enviar(b.dataset.t));

// Instalación
let promptInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; mostrarAviso(); });
function mostrarAviso() {
  const a = $('aviso');
  if (standalone) { a.style.display = 'none'; return; }
  if (esIOS) { a.innerHTML = '📲 <b>Instala la app en tu iPhone</b> para recibir avisos:<br>1. Abre este link en <b>Safari</b><br>2. Toca <b>Compartir</b> (el cuadrito con flecha ↑)<br>3. Elige <b>"Agregar a inicio"</b> y luego abre la app desde el ícono 🍓'; a.style.display = 'block'; return; }
  if (promptInstalar) { a.innerHTML = '📲 <b>Instala la app</b> para tenerla como ícono y recibir avisos.<br><button id="btnInst">Instalar Frutimóvil</button>'; a.style.display = 'block'; $('btnInst').onclick = async () => { promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar = null; a.style.display = 'none'; }; }
}

// Notificaciones
const b64ToU8 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
async function prepararAvisos() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  const reg = await navigator.serviceWorker.register('sw.js?t=' + encodeURIComponent(token), { scope: './' });
  if (esIOS && !standalone) return;
  const sub = await reg.pushManager.getSubscription();
  if (Notification.permission === 'granted' && sub) { $('btnAvisos').style.display = 'none'; return; }
  if (Notification.permission === 'denied') return;
  $('btnAvisos').style.display = 'block';
}
$('btnAvisos').onclick = async () => {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { alert('Sin permiso no te puedo mandar avisos. Puedes activarlo en Ajustes → Notificaciones.'); return; }
    const reg = await navigator.serviceWorker.ready;
    const { clave } = await api({ accion: 'clave' });
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(clave) });
    await api({ accion: 'suscribir', suscripcion: sub.toJSON(), dispositivo: navigator.userAgent.slice(0, 120) });
    $('btnAvisos').style.display = 'none';
    historial.push({ de: 'bot', texto: '🔔 ¡Listo! Te voy a avisar cuando haya fruta por vencer y el resumen del lunes.', ts: Date.now() }); guardar(); render();
  } catch (e) { alert('No pude activar los avisos: ' + e.message); }
};

(async () => {
  render(); mostrarAviso();
  if (!token) { $('quien').textContent = 'Sin acceso'; historial = [{ de: 'bot', texto: '⚠️ Abre la app con tu link personal (te lo pasa Esteban).', ts: Date.now() }]; render(); return; }
  try { const d = await api({ accion: 'hola' }); $('quien').textContent = 'Hola, ' + d.nombre + ' 👋'; } catch (e) { $('quien').textContent = e.message; }
  try { await prepararAvisos(); } catch (e) {}
})();
</script>
</body>
</html>
