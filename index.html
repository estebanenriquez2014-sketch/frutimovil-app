<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Frutimóvil</title>
<meta name="theme-color" content="#FAF6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140C0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Frutimóvil">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --vino:#7B1E3A;--vino2:#A12C55;--berry:#D6336C;--acento:#7B1E3A;
  --bg:#FAF6F7;--card:#FFFFFF;--card2:#FFFFFF;--txt:#1F1217;--muted:#8A7780;--linea:#F1E8EB;--rosa:#FFF0F4;--rosa2:#FBD5E1;
  --verde:#18864A;--verdeBg:#E6F6EC;--ambar:#B26A00;--ambarBg:#FFF2D9;--rojo:#C62828;--rojoBg:#FDE9E9;--gris:#8E949B;--grisBg:#F1EFF0;
  --r:20px;--sombra:0 1px 2px rgba(70,20,40,.05),0 6px 20px rgba(70,20,40,.06);--sombra2:0 10px 30px rgba(123,30,58,.28);
  --nav:66px;
}
@media (prefers-color-scheme:dark){:root{
  --acento:#FF8DB0;--bg:#140C0F;--card:#20151A;--card2:#281A20;--txt:#F7EDF0;--muted:#A8949C;--linea:#33222A;--rosa:#35202A;--rosa2:#55303F;
  --verde:#5BD08C;--verdeBg:#15301F;--ambar:#F2B544;--ambarBg:#3A2A0C;--rojo:#FF7B7B;--rojoBg:#3D1A1A;--gris:#9AA0A6;--grisBg:#2A2125;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--txt)}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.ic{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button:active{transform:scale(.97)}button{transition:transform .08s}
/* Encabezado */
.top{padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;flex-shrink:0;display:flex;align-items:center;gap:12px}
.top .logo{width:46px;height:46px;border-radius:14px;background:#fff;box-shadow:var(--sombra)}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top>div:nth-child(2){min-width:0;flex:1}
.top .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.top .acc{display:flex;gap:8px;flex-shrink:0}
.ico{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--sombra);display:grid;place-items:center;color:var(--acento);position:relative}
.ico.gira .ic{animation:gira .9s linear infinite}
.ico .punto{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--berry);border:2px solid var(--card)}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--berry),var(--vino));box-shadow:var(--sombra)}
@keyframes gira{to{transform:rotate(360deg)}}
/* Contenido */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(var(--nav) + env(safe-area-inset-bottom) + 96px);scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.vista{display:none}.vista.on{display:block;animation:entra .22s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.secc{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px}
.secc h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.secc .link{font-size:13px;font-weight:700;color:var(--berry);display:flex;align-items:center;gap:2px}
.secc .link .ic{width:15px;height:15px;stroke-width:2.4}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);padding:16px}
.card+.card{margin-top:10px}
/* Tarjeta principal */
.hero{border-radius:26px;padding:20px 20px 16px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,#E24C82 0%,rgba(226,76,130,0) 55%),linear-gradient(135deg,#5E1530 0%,#8A2146 55%,#B5305F 100%);box-shadow:var(--sombra2)}
.hero::after{content:"";position:absolute;right:-50px;bottom:-70px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .h-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;opacity:.92}
.hero .pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.hero .h-num{font-size:40px;font-weight:800;letter-spacing:-1.4px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .h-sub{display:flex;gap:16px;font-size:13px;opacity:.9}
.hero .h-sub b{font-weight:800}
.bars{display:flex;align-items:flex-end;gap:8px;height:74px;margin-top:16px;position:relative;z-index:1}
.bar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.bar i{display:block;width:100%;max-width:26px;border-radius:7px;background:rgba(255,255,255,.28);animation:crece .7s cubic-bezier(.2,.8,.2,1) backwards;transform-origin:bottom}
.bar.hoy i{background:#fff}
.bar span{font-size:10.5px;font-weight:700;opacity:.7}.bar.hoy span{opacity:1}
@keyframes crece{from{transform:scaleY(0)}}
/* Acciones rápidas */
.rapidas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rapidas button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:4px 0}
.qi{width:56px;height:56px;border-radius:19px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sombra);color:var(--acento)}
.qi .ic{width:24px;height:24px}
.qi.dest{background:linear-gradient(135deg,var(--berry),var(--vino));color:#fff;box-shadow:0 8px 18px rgba(214,51,108,.35)}
/* Dos números */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);padding:14px 14px 13px;text-align:left;display:block;width:100%}
.mini .et{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.mini .et .ic{width:16px;height:16px}
.mini .v{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.rojo{color:var(--rojo)}.verde{color:var(--verde)}.berry{color:var(--berry)}
.mini .pie{font-size:11.5px;color:var(--muted);margin-top:1px;font-weight:500}
/* Listas */
.fila{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea);width:100%;text-align:left}
.fila:last-child{border-bottom:0;padding-bottom:0}.fila:first-child{padding-top:0}
.fila .cu{min-width:0;flex:1}
.fila .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .s{font-size:12.5px;color:var(--muted);margin-top:1px;font-weight:500}
.fila .der{text-align:right;flex-shrink:0}
.fila .num{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.fila>.ic.ch{width:16px;height:16px;color:var(--muted);opacity:.6}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;background:var(--rosa);color:var(--acento);font-weight:800;font-size:15px}
.av.foto{background-size:cover;background-position:center}
.av.xl{width:62px;height:62px;border-radius:18px}
.av.ini{color:#fff}
.av.t-verde{background:var(--verdeBg);color:var(--verde)}.av.t-ambar{background:var(--ambarBg);color:var(--ambar)}.av.t-rojo{background:var(--rojoBg);color:var(--rojo)}.av.t-gris{background:var(--grisBg);color:var(--gris)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.liso::before{display:none}
.c-verde{background:var(--verdeBg);color:var(--verde)}.c-ambar{background:var(--ambarBg);color:var(--ambar)}.c-rojo{background:var(--rojoBg);color:var(--rojo)}.c-gris{background:var(--grisBg);color:var(--gris)}.c-vino{background:var(--rosa);color:var(--acento)}
.barra{height:6px;border-radius:9px;background:var(--grisBg);margin-top:12px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:9px;background:var(--verde);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vacio{text-align:center;color:var(--muted);padding:24px 10px;font-size:14px;font-weight:500}
.vacio .e{width:54px;height:54px;border-radius:18px;background:var(--rosa);color:var(--acento);display:grid;place-items:center;margin:0 auto 10px}
.vacio .e .ic{width:26px;height:26px}
.pieCard{display:flex;gap:8px;margin-top:14px}
.pieCard .btn{flex:1}
/* Stock */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{background:var(--card);border-radius:18px;box-shadow:var(--sombra);padding:12px 12px 11px}
.stats3 b{display:block;font-size:20px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stats3 span{font-size:11.5px;color:var(--muted);font-weight:600}
.prod{display:block;width:100%;text-align:left}
.prod.sin .av.foto{filter:grayscale(.75);opacity:.6}
.prod .nota{font-size:12.5px;color:var(--muted);margin-top:8px;font-weight:500}
.prod .nota b{color:var(--berry)}
.fotoG{height:150px;border-radius:20px;background-size:cover;background-position:center;margin-bottom:14px;position:relative;overflow:hidden}
.fotoG::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.6))}
.fotoG div{position:absolute;left:16px;bottom:12px;right:16px;color:#fff;z-index:1;display:flex;align-items:flex-end;justify-content:space-between}
.fotoG b{font-size:20px;font-weight:800}.fotoG span{font-size:26px;font-weight:800;letter-spacing:-.6px}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.datos div{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sombra)}
.datos div>span:first-child{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px}.datos b{font-size:15px;font-weight:800}
/* Pedidos */
.filtros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px 0 4px}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--sombra);font-size:13px;font-weight:700;color:var(--muted)}
.filtros button.on{background:var(--vino);color:#fff}
.filtros button b{opacity:.7;margin-left:3px}
.dia{font-weight:800;font-size:14px;margin:20px 2px 8px;display:flex;align-items:center;gap:8px}
.dia small{font-weight:700;font-size:11.5px}
.ped .cab{display:flex;align-items:center;gap:12px}
.ped .cab .t{font-weight:800;font-size:16px}
.ped .cab .s{font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
.ped .cab .tot{margin-left:auto;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.ped ul{list-style:none;padding:0;margin:12px 0 0;font-size:14px;background:var(--bg);border-radius:14px;padding:10px 12px}
.ped li{display:flex;justify-content:space-between;padding:3px 0;font-weight:500}
.ped li b{font-weight:800}
.ped .btn{width:100%;margin-top:12px}
.btn{border-radius:15px;padding:13px 16px;font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn .ic{width:18px;height:18px;stroke-width:2.2}
.btn.prim{background:linear-gradient(135deg,var(--vino2),var(--vino));color:#fff;box-shadow:0 6px 16px rgba(123,30,58,.28)}
.btn.sec{background:var(--card);color:var(--acento);box-shadow:inset 0 0 0 1.5px var(--rosa2)}
.btn.ancho{width:100%;padding:15px;font-size:15.5px}
.btn:disabled{opacity:.5}
/* Barra inferior */
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:var(--card);border-radius:24px;box-shadow:0 8px 30px rgba(60,15,30,.16),0 0 0 1px var(--linea);display:flex;padding:6px;z-index:20;height:var(--nav)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);border-radius:18px;position:relative;transition:background .2s,color .2s}
nav button.on{color:var(--acento);background:var(--rosa)}
nav .badge{position:absolute;top:5px;right:calc(50% - 22px);background:var(--berry);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card);box-sizing:content-box}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 24px);width:60px;height:60px;border-radius:21px;background:linear-gradient(135deg,var(--berry),var(--vino));color:#fff;box-shadow:0 10px 26px rgba(214,51,108,.42);z-index:21;display:grid;place-items:center}
.fab .ic{width:28px;height:28px;stroke-width:2.3}
/* Hojas inferiores */
.velo{position:fixed;inset:0;background:rgba(25,10,16,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;z-index:41;max-height:92dvh;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1);padding:10px 18px calc(env(safe-area-inset-bottom) + 20px)}
.hoja.on{transform:none}
.hoja .asa{width:40px;height:5px;border-radius:5px;background:var(--rosa2);margin:2px auto 14px}
.hoja h3{font-size:20px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
.hoja h3 .hi{width:38px;height:38px;border-radius:13px;background:var(--rosa);color:var(--acento);display:grid;place-items:center}
.hoja p.ay{color:var(--muted);font-size:13.5px;margin:-8px 0 14px;font-weight:500}
.dest-doc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:22px;color:#fff;background:radial-gradient(120% 160% at 100% 0%,#E24C82 0%,rgba(226,76,130,0) 60%),linear-gradient(135deg,#5E1530,#9A2750);box-shadow:var(--sombra2);margin-bottom:12px}
.dest-doc .qi{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;width:50px;height:50px;border-radius:16px}
.dest-doc b{display:block;font-size:16px;font-weight:800}.dest-doc span{font-size:12.5px;opacity:.85}
.dest-doc .ia{margin-left:auto;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.2);display:flex;gap:4px;align-items:center}
.dest-doc .ia .ic{width:12px;height:12px}
.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acciones button{background:var(--card);border-radius:18px;box-shadow:var(--sombra);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:12.5px}
.acciones .qi{width:44px;height:44px;border-radius:15px;box-shadow:none;background:var(--rosa)}
label.campo{display:block;margin-bottom:12px}
label.campo span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.inp{width:100%;background:var(--card);border:1.5px solid var(--linea);border-radius:15px;padding:13px 14px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--berry);box-shadow:0 0 0 4px rgba(214,51,108,.12)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.renglon{background:var(--card);border:1.5px solid var(--linea);border-radius:18px;padding:10px;margin-bottom:10px;position:relative}
.renglon .inp{border-color:transparent;background:var(--bg)}
.renglon .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.renglon .x{position:absolute;top:-8px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--rojoBg);color:var(--rojo);font-weight:800;line-height:1}
.mas{color:var(--berry);font-weight:800;padding:6px 2px;margin-bottom:12px;font-size:14px}
.seg{display:flex;background:var(--grisBg);border-radius:15px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--acento);box-shadow:var(--sombra)}
.resumen{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sombra);white-space:pre-wrap;font-size:15px;line-height:1.55;margin-bottom:14px}
.fila2{display:flex;gap:10px}.fila2 .btn{flex:1}
.contacto{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:-4px 0 12px;padding:11px;border-radius:14px;border:1.5px dashed var(--rosa2);background:var(--rosa);color:var(--acento);font-weight:700;font-size:14px}
/* Escáner de documentos */
.esc-ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.esc-op{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px;border-radius:22px;background:var(--card);box-shadow:var(--sombra);font-weight:800;font-size:14.5px;cursor:pointer;text-align:center}
.esc-op small{font-weight:500;font-size:12px;color:var(--muted);display:block;margin-top:2px}
.esc-op.prim{background:linear-gradient(135deg,var(--vino2),var(--vino));color:#fff;box-shadow:var(--sombra2)}
.esc-op.prim small{color:rgba(255,255,255,.8)}
.esc-op .ic{width:30px;height:30px}
.tips{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px 8px}
.tips li{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.tips .ic{width:14px;height:14px;color:var(--verde);stroke-width:2.6}
.leyendo{text-align:center;padding:6px 0 10px}
.papel{width:190px;height:250px;margin:0 auto 18px;border-radius:16px;overflow:hidden;position:relative;background:#fff;box-shadow:0 14px 40px rgba(60,15,30,.25)}
.papel img{width:100%;height:100%;object-fit:cover}
.papel .pdf{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#7B1E3A;font-weight:700;font-size:12.5px;padding:14px;word-break:break-word}
.papel .pdf .ic{width:54px;height:54px;stroke-width:1.4}
.papel .laser{position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,rgba(214,51,108,0),rgba(214,51,108,.35));border-bottom:2.5px solid #D6336C;animation:laser 1.8s ease-in-out infinite}
@keyframes laser{0%{top:-60px}100%{top:250px}}
.paso{font-weight:800;font-size:16px}
.paso+small{display:block;color:var(--muted);font-size:13px;margin-top:4px;font-weight:500}
.prog{height:6px;border-radius:6px;background:var(--grisBg);overflow:hidden;margin:16px 30px 0}
.prog i{display:block;height:100%;width:40%;border-radius:6px;background:linear-gradient(90deg,var(--berry),var(--vino));animation:prog 1.3s ease-in-out infinite}
@keyframes prog{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.leido{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--rosa);margin-bottom:12px}
.leido .qi{width:46px;height:46px;border-radius:15px;box-shadow:none;background:var(--card)}
.leido b{display:block;font-size:15px;font-weight:800}.leido span{font-size:12.5px;color:var(--muted);font-weight:600}
.leido .chip{margin-left:auto}
.duda{display:flex;gap:10px;align-items:flex-start;background:var(--ambarBg);color:var(--ambar);border-radius:16px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.duda .ic{width:18px;height:18px;margin-top:1px}
/* Éxito */
.exito{text-align:center;padding:4px 0 6px}
.exito svg{width:84px;height:84px}
.exito circle{fill:var(--verdeBg);animation:pop .4s cubic-bezier(.2,1.4,.4,1) backwards}
.exito path{fill:none;stroke:var(--verde);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:traza .45s .25s ease-out forwards}
.exito h3{justify-content:center;margin:8px 0 12px}
@keyframes pop{from{transform:scale(0);transform-origin:center}}
@keyframes traza{to{stroke-dashoffset:0}}
/* Chat */
.chat{display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:11px 14px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;line-height:1.45;animation:entra .2s ease-out}
.yo{align-self:flex-end;background:linear-gradient(135deg,var(--vino2),var(--vino));color:#fff;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px;box-shadow:var(--sombra)}
.bot .bts{display:flex;gap:8px;margin-top:10px}
.bot .bts button{flex:1;border:1.5px solid var(--acento);color:var(--acento);border-radius:13px;padding:9px;font-weight:700}
.bot .bts button.si{background:var(--vino);border-color:var(--vino);color:#fff}
.bot .bts button:disabled{opacity:.4}
.hora{font-size:10.5px;opacity:.55;margin-top:3px;text-align:right}
.escr{align-self:flex-start;color:var(--muted);font-size:13.5px;padding:6px 4px;font-weight:600}
.entrada{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 18px);display:none;gap:8px;align-items:flex-end;z-index:15}
.entrada.on{display:flex}
.entrada .caja{flex:1;display:flex;align-items:flex-end;background:var(--card);border-radius:24px;box-shadow:0 6px 22px rgba(60,15,30,.14),0 0 0 1px var(--linea);padding:4px 4px 4px 6px}
.entrada textarea{flex:1;resize:none;border:0;background:none;padding:10px 8px;font-size:16px;max-height:110px;outline:none}
.entrada .adj{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex-shrink:0}
.entrada button{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--berry),var(--vino));color:#fff;flex-shrink:0;display:grid;place-items:center;box-shadow:0 6px 16px rgba(214,51,108,.35)}
.sug{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.sug::-webkit-scrollbar{display:none}
.sug button{flex-shrink:0;background:var(--card);box-shadow:var(--sombra);color:var(--acento);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.sug .ic{width:15px;height:15px}
#v-bot{padding-bottom:70px}
/* Avisos y varios */
.banner{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);padding:14px 16px;margin-bottom:12px;font-size:13.5px;display:none;font-weight:500}
.banner b{color:var(--acento)}
.banner .btn{margin-top:10px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-160%);background:#1F1217;color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;z-index:90;transition:transform .3s cubic-bezier(.2,.9,.2,1);max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.on{transform:translate(-50%,0)}
.esq{background:linear-gradient(90deg,var(--linea) 25%,var(--card) 50%,var(--linea) 75%);background-size:200% 100%;animation:esq 1.2s infinite;border-radius:var(--r);height:90px;margin-bottom:10px}
@keyframes esq{to{background-position:-200% 0}}
.demo{position:fixed;left:20px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 22px);font-size:10px;font-weight:800;letter-spacing:.6px;background:var(--ambarBg);color:var(--ambar);padding:2px 8px;border-radius:999px;z-index:30}
.cuenta-cab{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.cuenta-cab .avatar{width:56px;height:56px;border-radius:19px;font-size:20px}
.cuenta-cab b{font-size:19px;font-weight:800;display:block}.cuenta-cab span{font-size:13px;color:var(--muted);font-weight:600}
.ver{text-align:center;color:var(--muted);font-size:11.5px;margin-top:16px;font-weight:600}
textarea.inp{min-height:150px;resize:vertical;line-height:1.5;font-size:15px}
@media (min-width:700px){body{background:radial-gradient(60% 60% at 50% 0%,var(--rosa),var(--bg))}.top,main{max-width:520px;margin:0 auto;width:100%}nav,.entrada{max-width:496px;margin:0 auto}.fab{right:calc(50% - 242px)}.hoja{max-width:520px;margin:0 auto}}
/* Comprobante */
#compro{position:fixed;inset:0;z-index:80;background:#eee;overflow:auto;display:none;padding:14px 12px 90px}
#compro.on{display:block}
.doc{background:#fff;color:#222;max-width:560px;margin:0 auto;border-radius:14px;padding:22px 20px;box-shadow:0 4px 18px rgba(0,0,0,.12);font-size:14px}
.doc .cab{display:flex;align-items:center;gap:12px;border-bottom:3px solid #7B1E3A;padding-bottom:12px}
.doc .cab img{width:58px;height:58px;border-radius:12px}
.doc .marca{font-size:21px;font-weight:800;color:#7B1E3A;line-height:1.1}
.doc .marca small{display:block;font-size:12px;font-weight:600;color:#777}
.doc .num{margin-left:auto;text-align:right;font-size:12px;color:#555}
.doc .num b{display:block;font-size:16px;color:#222}
.doc h4{margin:16px 0 4px;font-size:17px;color:#7B1E3A}
.doc .meta{color:#555;font-size:13px;line-height:1.6}
.doc table{width:100%;border-collapse:collapse;margin-top:12px}
.doc th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:#777;border-bottom:1.5px solid #ddd;padding:6px 4px}
.doc td{padding:8px 4px;border-bottom:1px solid #eee;vertical-align:top}
.doc td.d,.doc th.d{text-align:right;white-space:nowrap}
.doc .tot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 14px;background:#FFF1F5;border-radius:10px;font-size:18px;font-weight:800;color:#7B1E3A}
.doc .extra{margin-top:10px;color:#444;font-size:13px}
.doc .firmas{display:flex;gap:24px;margin-top:46px}
.doc .firmas div{flex:1;border-top:1px solid #999;padding-top:6px;text-align:center;font-size:12px;color:#666}
.doc .pie{margin-top:18px;text-align:center;font-size:11px;color:#999}
.compro-bts{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.1)}
.compro-bts button{flex:1}
.compro-bts .btn.sec{background:#FFF0F4;color:#7B1E3A}
@media print{
  body>*:not(#compro){display:none!important}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #compro{position:static;display:block;background:#fff;padding:0;overflow:visible}
  .doc{box-shadow:none;max-width:none;border-radius:0}
  .compro-bts{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
const VERSION = '3.0';
const API = 'https://frutimovil.duckdns.org/webhook/fm-app-api';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const DEMO = qs.has('demo');
let token = qs.get('t') || '';
try { if (token) localStorage.setItem('fm_token', token); else token = localStorage.getItem('fm_token') || ''; } catch (e) {}
if (DEMO) token = 'demo';
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const EMOJI = { 'FRE-GR': '🍓', 'FRE-DP': '🍓', 'MOR-01': '🫐', 'FRA-PR': '❤️', 'FRA-MD': '💗', 'ARA-01': '🫐', 'MIX-20': '🧊' };
const FOTO = { 'FRE-GR': 'fresa-grande', 'FRE-DP': 'fresa-despistonada', 'MOR-01': 'mora', 'FRA-PR': 'frambuesa-primera', 'FRA-MD': 'frambuesa-madura', 'ARA-01': 'arandano', 'MIX-20': 'mix-congelado' };
const ic = (n, c) => '<svg class="ic' + (c ? ' ' + c : '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const avProd = (cod, cls) => FOTO[cod] ? '<div class="av foto ' + (cls || '') + '" style="background-image:url(fotos/' + FOTO[cod] + '.jpg)"></div>' : '<div class="av ' + (cls || '') + '">' + ic('leaf') + '</div>';
const COLORES = ['#7B1E3A', '#D6336C', '#B5477A', '#8A4FBF', '#2E7FB0', '#1F8F4E', '#C77D0A', '#D2553A'];
const iniciales = n => { const p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : (p[0] || '')[1] || '')).toUpperCase(); };
const avNombre = n => { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return '<div class="av ini" style="background:' + COLORES[h % COLORES.length] + '">' + esc(iniciales(n)) + '</div>'; };
const din = n => '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const kg = (n, u) => (Math.round((Number(n) || 0) * 100) / 100) + (u === 'funda' ? ' fundas' : ' kg');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const js = s => esc(s).replace(/'/g, "\\'");

const espera = ms => new Promise(r => setTimeout(r, ms));
async function api(body) {
  if (DEMO) return window.FM_DEMO.api(body);
  // Reintenta solo cuando el servidor está reiniciando (502/503/504) o no contesta; los registros no se duplican
  // porque el Cerebro solo escribe al confirmar con "Sí".
  const reintentable = !(body.boton_id === 'si');
  let ultimo = null;
  for (let intento = 1; intento <= (reintentable ? 3 : 1); intento++) {
    const ctl = new AbortController();
    const reloj = setTimeout(() => ctl.abort(), body.accion === 'documento' ? 90000 : 45000);
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ token }, body)), signal: ctl.signal });
      clearTimeout(reloj);
      if (r.status === 401) throw Object.assign(new Error('Este link no es válido. Pídele a Esteban tu link de acceso.'), { final: true });
      if ([502, 503, 504].includes(r.status)) { ultimo = new Error('El servidor se está reiniciando. Intenta de nuevo en un minuto.'); await espera(4000 * intento); continue; }
      if (!r.ok) throw Object.assign(new Error('El servidor tuvo un problema (' + r.status + '). Intenta de nuevo.'), { final: true });
      const txt = await r.text();
      try { return JSON.parse(txt); } catch (e) { throw Object.assign(new Error('El asistente está ocupado en este momento. Intenta de nuevo en un minuto.'), { final: true }); }
    } catch (e) {
      clearTimeout(reloj);
      if (e.final) throw e;
      ultimo = e.name === 'AbortError' ? new Error('El servidor está muy lento. Revisa en un minuto si se registró antes de repetir.') : new Error('Sin conexión con el servidor. Revisa tu internet.');
      if (intento < 3 && reintentable) await espera(3000 * intento);
    }
  }
  throw ultimo;
}

// Las fotos se achican a 1600 px (JPEG) para subir rápido; los PDF van tal cual (máx. 8 MB).
function leerArchivo(f) { return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = mal; r.readAsDataURL(f); }); }
async function achicarFoto(f) {
  const url = await leerArchivo(f);
  const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('No pude abrir esa foto. Prueba con otra.')); i.src = url; });
  const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}
async function prepararDocumento(f) {
  const esPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
  if (!esPdf && !(f.type || '').startsWith('image/')) throw new Error('Solo puedo leer fotos o archivos PDF.');
  if (esPdf && f.size > 8 * 1024 * 1024) throw new Error('El PDF es muy grande (máximo 8 MB).');
  const dataUrl = esPdf ? await leerArchivo(f) : await achicarFoto(f);
  const datos = dataUrl.slice(dataUrl.indexOf(',') + 1);
  return { mime: esPdf ? 'application/pdf' : 'image/jpeg', datos, nombre: f.name || (esPdf ? 'documento.pdf' : 'foto.jpg'), vista: esPdf ? '' : dataUrl };
}

/* ---------- Comprobantes ---------- */
const TIPO_DOC = { compra: 'Comprobante de compra', pedido: 'Nota de pedido', entrega: 'Nota de entrega', venta: 'Nota de venta', cobro: 'Recibo de cobro', pago: 'Comprobante de pago', 'pago proveedor': 'Comprobante de pago', merma: 'Registro de fruta botada', deshacer: 'Anulación' };
const ICONO_MOV = { compra: 'receipt', pedido: 'list', entrega: 'truck', venta: 'cash', cobro: 'in', pago: 'out', 'pago proveedor': 'out', merma: 'trash', deshacer: 'undo' };
const nComp = n => String(n).padStart(6, '0');
function filasMovimientos(lista) {
  return lista.map(a => '<button class="fila" onclick="verComprobante(' + a.numero + ')"><div class="av">' + ic(ICONO_MOV[a.tipo] || 'file') + '</div><div class="cu"><div class="t" style="font-size:14px">' + esc(String(a.texto).replace(/^\S+\s/, '')) + '</div><div class="s">' + esc(a.usuario) + ' · ' + esc(String(a.fecha).slice(5, 16).replace('-', '/')) + ' · N.º ' + nComp(a.numero) + '</div></div>' + ic('chev', 'ch') + '</button>').join('');
}
function verMovimientos() { abrirHoja('<h3><span class="hi">' + ic('receipt') + '</span>Comprobantes</h3><p class="ay">Toca uno para verlo, imprimirlo o guardarlo en PDF.</p><div class="card">' + filasMovimientos((TB && TB.actividad) || []) + '</div>'); }
function verComprobante(numero) {
  const m = ((TB && TB.actividad) || []).find(a => a.numero === numero);
  if (!m) return toast('No encontré ese comprobante');
  const lineas = String(m.resumen).split('\n').map(s => s.trim()).filter(Boolean);
  const titulo = lineas.shift().replace(/^\S+\s/, '');
  const items = [], extra = []; let total = '';
  lineas.forEach(l => {
    const it = l.match(/^•\s*(.+?)\s×\s(\$[\d.,]+)\s=\s(\$[\d.,]+)(.*)$/);
    if (it) { items.push({ desc: it[1], precio: it[2], sub: it[3], nota: it[4].replace(/⚠️/g, '').replace(/[()]/g, '').replace(/^\s*[—-]\s*/, '').trim() }); return; }
    const t = l.match(/^Total:\s*(\$[\d.,]+)(.*)$/i);
    if (t) { total = t[1]; return; }
    if (/^⚠️ = precio general/.test(l)) return;
    extra.push(l.replace(/^•\s*/, ''));
  });
  const fecha = String(m.fecha), f10 = fecha.slice(0, 10);
  let h = '<div class="doc"><div class="cab"><img src="logo-128.png" alt=""><div class="marca">Frutimóvil<small>Frutos rojos · Quito</small></div><div class="num">N.º<b>' + nComp(m.numero) + '</b></div></div>';
  h += '<h4>' + esc(TIPO_DOC[m.tipo] || 'Comprobante') + '</h4><div class="meta"><b>' + esc(titulo) + '</b><br>Fecha: ' + esc(fechaLarga(f10)) + ' ' + f10.slice(0, 4) + ', ' + esc(fecha.slice(11, 16)) + '<br>Registrado por: ' + esc(m.usuario) + '</div>';
  if (items.length) {
    h += '<table><tr><th>Detalle</th><th class="d">P. unit.</th><th class="d">Subtotal</th></tr>';
    items.forEach(i => { h += '<tr><td>' + esc(i.desc) + (i.nota ? '<div style="font-size:12px;color:#888">' + esc(i.nota) + '</div>' : '') + '</td><td class="d">' + esc(i.precio) + '</td><td class="d">' + esc(i.sub) + '</td></tr>'; });
    h += '</table>';
  }
  if (extra.length) h += '<div class="extra">' + extra.map(esc).join('<br>') + '</div>';
  if (total) h += '<div class="tot"><span>Total</span><span>' + esc(total) + '</span></div>';
  h += '<div class="firmas"><div>Entregué</div><div>Recibí conforme</div></div><div class="pie">Comprobante interno de Frutimóvil · no reemplaza a la factura<br>Ref. ' + esc(m.op_id || '') + '</div></div>';
  h += '<div class="compro-bts"><button class="btn sec" onclick="$(\'compro\').classList.remove(\'on\')">Cerrar</button>' + (navigator.share ? '<button class="btn sec" onclick="compartirComprobante(' + numero + ')">Compartir</button>' : '') + '<button class="btn prim" onclick="window.print()">' + ic('print') + 'Imprimir / PDF</button></div>';
  let c = $('compro'); if (!c) { c = document.createElement('div'); c.id = 'compro'; document.body.appendChild(c); }
  c.innerHTML = h; c.classList.add('on'); c.scrollTop = 0;
}
async function compartirComprobante(numero) {
  const m = ((TB && TB.actividad) || []).find(a => a.numero === numero); if (!m) return;
  try { await navigator.share({ title: 'Frutimóvil · N° ' + nComp(numero), text: 'Frutimóvil · ' + (TIPO_DOC[m.tipo] || 'Comprobante') + ' N° ' + nComp(numero) + '\n' + m.fecha + ' · ' + m.usuario + '\n\n' + String(m.resumen).replace(/⚠️ = precio general.*$/m, '').replace(/ ⚠️/g, '').trim() }); } catch (e) {}
}

/* ---------- Chat ---------- */
let hist = [];
try { hist = JSON.parse(localStorage.getItem('fm_hist') || '[]'); } catch (e) {}
const guardarHist = () => { try { localStorage.setItem('fm_hist', JSON.stringify(hist.slice(-60))); } catch (e) {} };
const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function pintarChat() {
  const c = $('chat'); c.innerHTML = '';
  if (!hist.length) c.innerHTML = vacio('chat', 'Escríbeme como en WhatsApp:<br><b style="color:var(--txt)">"compré 10 kg de fresa a Fabricio a 1.40"</b><br><br>O toca el clip para adjuntar una orden de compra o una factura.');
  hist.forEach((m, i) => {
    const d = document.createElement('div'); d.className = 'm ' + (m.de === 'yo' ? 'yo' : 'bot');
    d.innerHTML = fmt(m.texto) + '<div class="hora">' + hhmm(m.ts) + '</div>';
    if (m.botones && m.botones.length) { const b = document.createElement('div'); b.className = 'bts'; m.botones.forEach(bt => { const x = document.createElement('button'); x.textContent = bt.titulo; if (bt.id === 'si') x.className = 'si'; x.disabled = !!m.usado || i !== hist.length - 1; x.onclick = () => { m.usado = true; chatear(bt.titulo, bt.id); }; b.appendChild(x); }); d.insertBefore(b, d.lastChild); }
    c.appendChild(d);
  });
  if (vista === 'bot') $('main').scrollTop = $('main').scrollHeight;
}
let ocupado = false;
async function chatear(texto, boton) {
  texto = (texto || '').trim(); if ((!texto && !boton) || ocupado) return; ocupado = true;
  hist.push({ de: 'yo', texto, ts: Date.now() }); guardarHist(); pintarChat();
  const e = document.createElement('div'); e.className = 'escr'; e.textContent = 'Fruti-Bot está escribiendo…'; $('chat').appendChild(e); $('main').scrollTop = $('main').scrollHeight;
  try { const d = await api({ accion: 'mensaje', texto: boton ? '' : texto, boton_id: boton || '' }); hist.push({ de: 'bot', texto: d.texto || '…', botones: d.botones || [], ts: Date.now() }); if (boton === 'si') cargar(); }
  catch (er) { hist.push({ de: 'bot', texto: '⚠️ ' + er.message, ts: Date.now() }); }
  ocupado = false; guardarHist(); pintarChat();
}
$('entrada').onsubmit = e => { e.preventDefault(); const t = $('txt').value; $('txt').value = ''; chatear(t); };
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('entrada').requestSubmit(); } });
document.querySelectorAll('#sug button').forEach(b => b.onclick = () => chatear(b.dataset.t));

/* ---------- Instalación y avisos ---------- */
let promptInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; banner(); });
function banner() {
  const b = $('banner');
  if (standalone) { b.style.display = 'none'; return; }
  if (esIOS) { b.innerHTML = '📲 <b>Instala la app</b> para recibir avisos: toca <b>Compartir</b> (□↑) y luego <b>"Agregar a inicio"</b>. Después ábrela desde el ícono 🍓'; b.style.display = 'block'; return; }
  if (promptInstalar) { b.innerHTML = '📲 <b>Instala Frutimóvil</b> para tenerla como app y recibir avisos.<br><button class="btn prim" id="btnInst">Instalar</button>'; b.style.display = 'block'; $('btnInst').onclick = async () => { promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar = null; b.style.display = 'none'; }; }
}
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob((s + p).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)); };
async function prepararAvisos() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  const reg = await navigator.serviceWorker.register('sw.js?t=' + encodeURIComponent(token), { scope: './' });
  if (esIOS && !standalone) return;
  if (Notification.permission === 'denied') return;
  if (Notification.permission === 'granted' && await reg.pushManager.getSubscription()) return;
  $('btnAvisos').style.display = 'grid';
}
$('btnAvisos').onclick = async () => {
  try {
    if (await Notification.requestPermission() !== 'granted') return toast('Sin permiso no puedo avisarte');
    const reg = await navigator.serviceWorker.ready;
    const { clave } = await api({ accion: 'clave' });
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(clave) });
    await api({ accion: 'suscribir', suscripcion: sub.toJSON(), dispositivo: navigator.userAgent.slice(0, 120) });
    $('btnAvisos').style.display = 'none'; toast('Avisos activados');
  } catch (e) { toast('No pude activar los avisos'); }
};

/* ---------- Adjuntar un documento desde el chat ---------- */
$('archivoChat').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f || ocupado) return; ocupado = true;
  hist.push({ de: 'yo', texto: '📎 ' + (f.name || 'Documento'), ts: Date.now() }); guardarHist(); pintarChat();
  const e = document.createElement('div'); e.className = 'escr'; e.textContent = 'Leyendo el documento…'; $('chat').appendChild(e); $('main').scrollTop = $('main').scrollHeight;
  try {
    const a = await prepararDocumento(f);
    const d = await api({ accion: 'documento', archivo: { mime: a.mime, datos: a.datos, nombre: a.nombre } });
    const D = d.documento || {};
    hist.push({ de: 'bot', texto: (D.duda ? '⚠️ ' + D.duda + '\n\n' : '') + (d.texto || '…'), botones: d.botones || [], ts: Date.now() });
  } catch (er) { hist.push({ de: 'bot', texto: '⚠️ ' + er.message, ts: Date.now() }); }
  ocupado = false; guardarHist(); pintarChat();
};

/* ---------- Mi cuenta ---------- */
let NOMBRE = '';
$('btnCuenta').onclick = () => {
  const avisos = !('Notification' in window) ? 'No disponibles en este teléfono' : Notification.permission === 'granted' ? 'Activados' : Notification.permission === 'denied' ? 'Bloqueados en el teléfono' : 'Sin activar';
  abrirHoja('<div class="cuenta-cab"><div class="avatar">' + esc(iniciales(NOMBRE || 'Frutimóvil')) + '</div><div><b>' + esc(NOMBRE || 'Frutimóvil') + '</b><span>Frutimóvil · Frutos rojos · Quito</span></div></div><div class="card">' +
    '<button class="fila" onclick="cerrarHoja();$(\'btnAvisos\').style.display!==\'none\'?$(\'btnAvisos\').click():toast(\'Avisos: ' + avisos.toLowerCase() + '\')"><div class="av">' + ic('bell') + '</div><div class="cu"><div class="t">Avisos en el teléfono</div><div class="s">' + avisos + '</div></div>' + ic('chev', 'ch') + '</button>' +
    '<button class="fila" onclick="verMovimientos()"><div class="av">' + ic('receipt') + '</div><div class="cu"><div class="t">Comprobantes</div><div class="s">Ver, imprimir o guardar en PDF</div></div>' + ic('chev', 'ch') + '</button>' +
    '<button class="fila" onclick="abrirEscaner()"><div class="av">' + ic('scan') + '</div><div class="cu"><div class="t">Escanear orden o factura</div><div class="s">Foto o PDF, con inteligencia artificial</div></div>' + ic('chev', 'ch') + '</button>' +
    (TB && TB.comprar.length ? '<button class="fila" onclick="pedidoProveedor()"><div class="av">' + ic('send') + '</div><div class="cu"><div class="t">Pedido al proveedor</div><div class="s">Lo que falta para los pedidos</div></div>' + ic('chev', 'ch') + '</button>' : '') +
    '</div><div class="ver">Frutimóvil ' + VERSION + (DEMO ? ' · modo demostración' : '') + '</div>');
};

/* ---------- Inicio ---------- */
function saludar(nombre) {
  const h = new Date().getHours();
  $('saludo').textContent = nombre ? 'Hola, ' + nombre : (h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches');
  if (nombre) { NOMBRE = nombre; $('btnCuenta').textContent = iniciales(nombre); try { localStorage.setItem('fm_nombre', nombre); } catch (e) {} }
}
(async () => {
  $('fecha').textContent = fechaLarga(hoyISO());
  let guardado = ''; try { guardado = localStorage.getItem('fm_nombre') || ''; } catch (e) {}
  saludar(DEMO ? '' : guardado);
  if (DEMO) {
    await new Promise((ok, mal) => { const s = document.createElement('script'); s.src = 'demo.js'; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
    if (qs.get('demo') !== 'video') $('fecha').textContent += ' · Demo';
    hist = [];
  }
  pintarChat(); if (!DEMO) banner();
  if (!token) { $('v-inicio').innerHTML = vacio('alert', 'Abre la app con tu link personal.'); return; }
  if (TB) pintar(); else $('v-inicio').innerHTML = '<div class="esq" style="height:190px;border-radius:26px"></div><div class="esq" style="height:70px"></div><div class="esq"></div>';
  try { const d = await api({ accion: 'hola' }); saludar(d.nombre); } catch (e) {}
  await cargar();
  if (DEMO) return;
  try { await prepararAvisos(); } catch (e) {}
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden && token && !DEMO) cargar(); });
</script>
</body>
</html>
